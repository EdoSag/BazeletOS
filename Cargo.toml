[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/EdoSag/BazeletOS"
publish = false

[workspace.dependencies]
branding = { path = "crates/branding" }
i18n = { path = "crates/i18n" }
ui = { path = "crates/ui" }

[workspace.lints.rust]
# `unsafe` needs a reason. Allow it on the smallest item that needs it,
# with a `// SAFETY:` comment. See CONTRIBUTING.md.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
