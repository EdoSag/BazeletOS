[package]
name = "ui"
description = "Layout direction helpers so every screen mirrors for right-to-left languages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
i18n.workspace = true

iced_core = "0.14.0"
iced_graphics = "0.14.0"
iced_runtime = "0.14.0"
# The renderer always builds its window backend; only Wayland is wanted.
iced_tiny_skia = { version = "0.14.1", default-features = false, features = ["wayland"] }
iced_widget = "0.14.2"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
wayland-client = "0.31"

[lints]
workspace = true
