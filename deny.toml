# Dependency policy, checked by `cargo deny check` in CI.
# Every crate we ship is audited; see CONTRIBUTING.md before adding one.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build.
version = 2
yanked = "deny"

[licenses]
version = 2
# Licences a dependency may use. All are compatible with GPL-3.0-or-later.
# Adding to this list is a licence decision: record it in an ADR.
allow = [
    "GPL-3.0-or-later",
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The list is a policy, so entries no dependency uses yet are expected.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version, which is fine.
allow-wildcard-paths = true

[sources]
# Only crates.io. A git dependency needs a reason and a pinned commit,
# listed here.
unknown-registry = "deny"
unknown-git = "deny"
